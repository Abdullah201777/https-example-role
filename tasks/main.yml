---
# tasks file for roles/nginx-role
- name: install nginx
  dnf:
    name: nginx
    state: present

- name: configre the template
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/def.conf
    mode: "0644"
    owner: root
    group: root
  notify: Restart nginx

- name: restart and enable nginx
  service:
    name: nginx
    state: started
    enabled: true
